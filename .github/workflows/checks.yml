# Runs on every pull request and every push, so a change that breaks the build,
# the translations or the tests is caught before anyone has to read it.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    # The add-on reads keyboard layouts and the process list from Windows, so
    # the tests need a real Windows to run on.
    runs-on: windows-latest
    env:
      # The runner's console is cp1252, which cannot print Persian or Russian.
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Look for mistakes in the code
        # PowerShell, the default on Windows, passes tools/*.py on unexpanded.
        shell: bash
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes globalPlugins/superTools.py buildVars.py tools/*.py tests/*.py

      - name: Check the translations
        run: python tools/check_locale.py

      # The build compiles the translations the tests read, so it goes first.
      - name: Build the add-on
        run: python tools/build.py

      - name: Run the tests
        # When the suite stops on an error, its last lines go on the run's page.
        shell: bash
        run: |
          set -o pipefail
          python tests/test_supertools.py 2>&1 | tee tests.log || {
            echo "::error title=Tests stopped::$(tail -n 25 tests.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          }

      - name: Keep the built add-on with this run
        uses: actions/upload-artifact@v4
        with:
          name: add-on
          path: "*.nvda-addon"
          if-no-files-found: error
